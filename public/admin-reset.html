<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BD ADMIN - নতুন পাসওয়ার্ড</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 18px;
    }
    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 4px 20px #0002;
    }
    h2, h3 { text-align: center; }
    h2 { color: #087f5b; }
    input, button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border-radius: 8px;
      font-size: 16px;
    }
    input { border: 1px solid #ccc; }
    button {
      border: 0;
      background: #087f5b;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    #message {
      text-align: center;
      margin-top: 15px;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>BD ADMIN</h2>
    <h3>নতুন পাসওয়ার্ড সেট করুন</h3>

    <form id="resetForm" hidden>
      <input id="password" type="password"
        placeholder="নতুন পাসওয়ার্ড"
        minlength="8" autocomplete="new-password" required>

      <input id="confirmPassword" type="password"
        placeholder="পাসওয়ার্ড আবার লিখুন"
        minlength="8" autocomplete="new-password" required>

      <button id="submitBtn" type="submit">
        পাসওয়ার্ড পরিবর্তন করুন
      </button>
    </form>

    <p id="message">রিসেট লিংক যাচাই হচ্ছে...</p>
  </div>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL =
      "https://xqefplcyblzztuchdxpo.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_VtKcNjnEM75QwAl24DuWHg_wVh5iBf2";

    // Admin Login-এর সঠিক URL নিশ্চিত হলে এখানে বসাতে হবে।
    const ADMIN_URL =
      "https://bd-business.shohagkhan017500411.workers.dev/";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_KEY,
      {
        auth: {
          detectSessionInUrl: false,
          persistSession: true,
          autoRefreshToken: true
        }
      }
    );

    const form = document.getElementById("resetForm");
    const message = document.getElementById("message");
    const button = document.getElementById("submitBtn");

    let recoveryVerified = false;

    function showError(error) {
      const code = error?.code || "";
      const msg = error?.message || "";

      if (code === "otp_expired" ||
          msg.toLowerCase().includes("expired")) {
        return "রিসেট লিংকের মেয়াদ শেষ। নতুন Reset Email পাঠান।";
      }

      return "লিংক যাচাই করা যায়নি: " + msg;
    }

    async function verifyRecovery() {
      const params = new URLSearchParams(location.search);
      const hash = new URLSearchParams(
        location.hash.replace(/^#/, "")
      );

      const errorCode =
        params.get("error_code") || hash.get("error_code");

      const error =
        params.get("error") || hash.get("error");

      if (error || errorCode) {
        throw {
          code: errorCode || error,
          message:
            params.get("error_description") ||
            hash.get("error_description") ||
            errorCode || error
        };
      }

      const code = params.get("code");

      if (code) {
        const { data, error } =
          await supabase.auth.exchangeCodeForSession(code);

        if (error) throw error;
        if (!data.session) {
          throw new Error("Recovery Session পাওয়া যায়নি।");
        }
      } else {
        const accessToken = hash.get("access_token");
        const refreshToken = hash.get("refresh_token");
        const type = hash.get("type");

        if (!accessToken || !refreshToken ||
            type !== "recovery") {
          throw new Error(
            "Gmail-এর নতুন বৈধ Recovery Link ব্যবহার করুন।"
          );
        }

        const { data, error } =
          await supabase.auth.setSession({
            access_token: accessToken,
            refresh_token: refreshToken
          });

        if (error) throw error;
        if (!data.session) {
          throw new Error("Recovery Session পাওয়া যায়নি।");
        }
      }

      const { data, error } =
        await supabase.auth.getSession();

      if (error) throw error;
      if (!data.session) {
        throw new Error("Recovery Session পাওয়া যায়নি।");
      }

      recoveryVerified = true;
      form.hidden = false;
      message.textContent = "নতুন পাসওয়ার্ড দিন।";
    }

    try {
      await verifyRecovery();
    } catch (error) {
      message.textContent = showError(error);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!recoveryVerified) {
        message.textContent =
          "আগে বৈধ Gmail Recovery Link যাচাই করুন।";
        return;
      }

      const password =
        document.getElementById("password").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (password.length < 8) {
        message.textContent =
          "কমপক্ষে ৮ অক্ষরের পাসওয়ার্ড দিন।";
        return;
      }

      if (password !== confirmPassword) {
        message.textContent =
          "দুটি পাসওয়ার্ড মিলছে না।";
        return;
      }

      button.disabled = true;
      message.textContent = "পাসওয়ার্ড পরিবর্তন হচ্ছে...";

      try {
        const { data, error } =
          await supabase.auth.getSession();

        if (error) throw error;
        if (!data.session) {
          throw new Error("Recovery Session পাওয়া যায়নি।");
        }

        const { error: updateError } =
          await supabase.auth.updateUser({ password });

        if (updateError) throw updateError;

        recoveryVerified = false;
        form.reset();
        form.hidden = true;

        message.textContent =
          "পাসওয়ার্ড সফলভাবে পরিবর্তন হয়েছে।";

        await supabase.auth.signOut();

        message.textContent +=
          " লগইন পেজে নেওয়া হচ্ছে...";

        setTimeout(() => {
          window.location.replace(ADMIN_URL);
        }, 3000);

      } catch (error) {
        message.textContent =
          "সমস্যা হয়েছে: " + (error.message || "আবার চেষ্টা করুন।");
        button.disabled = false;
      }
    });
  </script>
</body>
  </html>
