
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BD ADMIN Password Reset</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      width: 85%;
      max-width: 380px;
      box-shadow: 0 4px 20px #0002;
    }
    h2 { text-align: center; color: #123; }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border-radius: 8px;
      font-size: 16px;
    }
    input { border: 1px solid #ccc; }
    button {
      border: 0;
      background: #087f5b;
      color: white;
      font-weight: bold;
    }
    #message { text-align: center; margin-top: 15px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>BD ADMIN</h2>
    <h3>নতুন পাসওয়ার্ড সেট করুন</h3>

    <form id="resetForm">
      <input
        id="password"
        type="password"
        placeholder="নতুন পাসওয়ার্ড"
        minlength="8"
        required
      >
      <input
        id="confirmPassword"
        type="password"
        placeholder="পাসওয়ার্ড আবার লিখুন"
        minlength="8"
        required
      >
      <button id="submitBtn" type="submit">
        পাসওয়ার্ড পরিবর্তন করুন
      </button>
    </form>

    <p id="message"></p>
  </div>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL =
      "https://xqefplcyblzztuchdxpo.supabase.co";

    // এখানে Supabase-এর public anon/publishable key বসবে।
    const SUPABASE_KEY = "PASTE_PUBLIC_ANON_KEY_HERE";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById("resetForm");
    const message = document.getElementById("message");
    const button = document.getElementById("submitBtn");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const password =
        document.getElementById("password").value;
      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (password.length < 8) {
        message.textContent = "কমপক্ষে ৮ অক্ষরের পাসওয়ার্ড দিন।";
        return;
      }

      if (password !== confirmPassword) {
        message.textContent = "দুটি পাসওয়ার্ড মিলছে না।";
        return;
      }

      button.disabled = true;
      message.textContent = "অপেক্ষা করুন...";

      const { error } = await supabase.auth.updateUser({
        password: password
      });

      if (error) {
        message.textContent =
          "সমস্যা হয়েছে: " + error.message;
      } else {
        message.textContent =
          "পাসওয়ার্ড পরিবর্তন হয়েছে। এখন BD ADMIN APK-তে লগইন করুন।";
        form.reset();
      }

      button.disabled = false;
    });
  </script>
</body>
</html>
