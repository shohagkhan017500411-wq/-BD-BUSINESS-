name: Build BD Admin APK

on:
  workflow_dispatch:
  push:
    paths:
      - "admin-app/**"
      - ".github/workflows/build-bd-admin-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        working-directory: admin-app
        run: npm install

      - name: Build app
        working-directory: admin-app
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Add Android
        working-directory: admin-app
        run: npx cap add android

      - name: Sync Android
        working-directory: admin-app
        run: npx cap sync android

      - name: Build APK
        working-directory: admin-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BD-ADMIN-APK
          path: admin-app/android/app/build/outputs/apk/debug/app-debug.apk
